global
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    option tcplog

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend rabbitmq_amqp
    bind *:5672
    default_backend rabbitmq_nodes_amqp

backend rabbitmq_nodes_amqp
    balance roundrobin
    option tcp-check
    server rabbitmq-1 rabbitmq-1:5672 check resolvers docker init-addr libc,none
    server rabbitmq-2 rabbitmq-2:5672 check resolvers docker init-addr libc,none
    server rabbitmq-3 rabbitmq-3:5672 check resolvers docker init-addr libc,none

frontend rabbitmq_management
    mode http
    bind *:15672
    default_backend rabbitmq_nodes_management

backend rabbitmq_nodes_management
    mode http
    balance roundrobin
    option httpchk GET /
    server rabbitmq-1 rabbitmq-1:15672 check resolvers docker init-addr libc,none
    server rabbitmq-2 rabbitmq-2:15672 check resolvers docker init-addr libc,none
    server rabbitmq-3 rabbitmq-3:15672 check resolvers docker init-addr libc,none
