services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: cruel
      RABBITMQ_DEFAULT_PASS: cruel123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mainServer

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./front:/usr/share/nginx/html:ro
    depends_on:
      - server-1
      - server-2
      - market-data
    networks:
      - mainServer

  server-1:
    build: ./microservicos/server
    expose:
      - "8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: cruel
      SPRING_RABBITMQ_PASSWORD: cruel123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mainServer

  server-2:
    build: ./microservicos/server
    expose:
      - "8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: cruel
      SPRING_RABBITMQ_PASSWORD: cruel123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mainServer

  order:
    build: ./microservicos/order service
    networks:
      - mainServer
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq

  market-data:
    build: "./microservicos/market data"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://cruel:cruel123@rabbitmq:5672
      PARTICOES: 4
      DB_PATH: /app/data/market.db
      TICK_MS: 1000
      SEED_MERCADO: ""
    volumes:
      - market-data:/app/data
      - "./microservicos/market data/config:/app/config:ro"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mainServer

networks:
  mainServer:
    driver: bridge

volumes:
  market-data:
