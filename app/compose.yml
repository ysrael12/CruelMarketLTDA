services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: cruel
      RABBITMQ_DEFAULT_PASS: cruel123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mainServer

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./front:/usr/share/nginx/html:ro
    depends_on:
      - websocket-1
      - websocket-2
      - market-data
    networks:
      - mainServer

  gateway-1:
    build: ./microservicos/gateway
    expose:
      - "8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: cruel
      SPRING_RABBITMQ_PASSWORD: cruel123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mainServer
  
  gateway-2:
    build: ./microservicos/gateway
    expose:
      - "8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: cruel
      SPRING_RABBITMQ_PASSWORD: cruel123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mainServer
        
  websocket-1:
    build: ./microservicos/websocket
    expose:
      - "8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: cruel
      SPRING_RABBITMQ_PASSWORD: cruel123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mainServer

  websocket-2:
    build: ./microservicos/websocket
    expose:
      - "8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: cruel
      SPRING_RABBITMQ_PASSWORD: cruel123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mainServer

  order:
    build: ./microservicos/order service
    networks:
      - mainServer
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: postgresql://postgres:123@bd-order-service:5432/order_service
      DB_USER: user
      DB_PASSWORD: 123
      SPRING_RABBITMQ_HOST: rabbitmq

  market-data:
    build: "./microservicos/market data"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://cruel:cruel123@rabbitmq:5672
      PARTICOES: 4
      DB_PATH: /app/data/market.db
      TICK_MS: 1000
      SEED_MERCADO: ""
      DB_URL: postgresql://postgres:123@bd-market-data:5432/market_data
      DB_USER: user
      DB_PASSWORD: 123
    volumes:
      - market-data:/app/data #remover
      - "./microservicos/market data/config:/app/config:ro" #remover
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mainServer

  # quando criar o container de "user-data":
  # environment:
  #   DB_URL: postgresql://postgres:123@bd-market-data:5432/user_data
  
  bd-market-data:
    image: postgres:18
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123
    volumes:
      - postgres_market_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  bd-order-service:
    image: postgres:18
    environment:
      POSTGRES_DB: order_service
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123
    volumes:
      - postgres_order_service:/var/lib/postgresql
    ports:
      - "5433:5432"
  
  bd-user-data:
    image: postgres:18
    environment:
      POSTGRES_DB: user_data
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123
    volumes:
      - postgres_user_data:/var/lib/postgresql
    ports:
      - "5434:5432"

networks:
  mainServer:
    driver: bridge

volumes:
  market-data: #remover
  postgres_market_data:
  postgres_order_service:
  postgres_user_data:
