services:
  # Broker legado mantido durante a migração para preservar o estado atual.
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: cruel
      RABBITMQ_DEFAULT_PASS: cruel123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mainServer

  rabbitmq-1:
    image: rabbitmq:4-management
    hostname: rabbitmq-1
    restart: unless-stopped
    expose:
      - "5672"
      - "15672"
      - "25672"
      - "4369"
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
      RABBITMQ_ERLANG_COOKIE: cruelmarketclusterdevcookie
      RABBITMQ_DEFAULT_USER: cruel
      RABBITMQ_DEFAULT_PASS: cruel123
    volumes:
      - rabbitmq_node1_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mainServer

  rabbitmq-2:
    image: rabbitmq:4-management
    hostname: rabbitmq-2
    restart: unless-stopped
    expose:
      - "5672"
      - "15672"
      - "25672"
      - "4369"
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
      RABBITMQ_ERLANG_COOKIE: cruelmarketclusterdevcookie
      RABBITMQ_DEFAULT_USER: cruel
      RABBITMQ_DEFAULT_PASS: cruel123
    volumes:
      - rabbitmq_node2_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mainServer

  rabbitmq-3:
    image: rabbitmq:4-management
    hostname: rabbitmq-3
    restart: unless-stopped
    expose:
      - "5672"
      - "15672"
      - "25672"
      - "4369"
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-3
      RABBITMQ_ERLANG_COOKIE: cruelmarketclusterdevcookie
      RABBITMQ_DEFAULT_USER: cruel
      RABBITMQ_DEFAULT_PASS: cruel123
    volumes:
      - rabbitmq_node3_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mainServer

  rabbitmq-cluster-proxy:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./rabbitmq/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:15672/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      rabbitmq-3:
        condition: service_healthy
    networks:
      - mainServer

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./front:/usr/share/nginx/html:ro
    depends_on:
      - websocket-1
      - websocket-2
      - market-data
    networks:
      - mainServer

  gateway-1:
    build: ./microservicos/gateway
    expose:
      - "8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq-cluster-proxy
      SPRING_RABBITMQ_USERNAME: cruel
      SPRING_RABBITMQ_PASSWORD: cruel123
    depends_on:
      rabbitmq-cluster-proxy:
        condition: service_healthy
    networks:
      - mainServer

  gateway-2:
    build: ./microservicos/gateway
    expose:
      - "8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq-cluster-proxy
      SPRING_RABBITMQ_USERNAME: cruel
      SPRING_RABBITMQ_PASSWORD: cruel123
    depends_on:
      rabbitmq-cluster-proxy:
        condition: service_healthy
    networks:
      - mainServer

  websocket-1:
    build: ./microservicos/websocket
    expose:
      - "8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq-cluster-proxy
      SPRING_RABBITMQ_USERNAME: cruel
      SPRING_RABBITMQ_PASSWORD: cruel123
    depends_on:
      rabbitmq-cluster-proxy:
        condition: service_healthy
    networks:
      - mainServer

  websocket-2:
    build: ./microservicos/websocket
    expose:
      - "8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq-cluster-proxy
      SPRING_RABBITMQ_USERNAME: cruel
      SPRING_RABBITMQ_PASSWORD: cruel123
    depends_on:
      rabbitmq-cluster-proxy:
        condition: service_healthy
    networks:
      - mainServer

  order:
    build: "./microservicos/order service"
    networks:
      - mainServer
    depends_on:
      rabbitmq-cluster-proxy:
        condition: service_healthy
    environment:
      DB_URL: postgresql://user:123@bd-order-service:5432/order_service
      DB_USER: user
      DB_PASSWORD: "123"
      SPRING_RABBITMQ_HOST: rabbitmq-cluster-proxy

  market-data:
    build: "./microservicos/market data"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://cruel:cruel123@rabbitmq-cluster-proxy:5672
      PARTICOES: 4
      DB_PATH: /app/data/market.db
      TICK_MS: 1000
      SEED_MERCADO: ""
      DB_URL: postgresql://user:123@bd-market-data:5432/market_data
      DB_USER: user
      DB_PASSWORD: "123"
    volumes:
      - market-data:/app/data
      - "./microservicos/market data/config:/app/config:ro"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      rabbitmq-cluster-proxy:
        condition: service_healthy
    networks:
      - mainServer

  user-data:
    build: "./microservicos/user data"
    container_name: user-data
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bd-user-data:5432/user_data
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: "123"
      SPRING_RABBITMQ_HOST: rabbitmq-cluster-proxy
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: cruel
      SPRING_RABBITMQ_PASSWORD: cruel123
    depends_on:
      bd-user-data:
        condition: service_started
      rabbitmq-cluster-proxy:
        condition: service_healthy
    networks:
      - mainServer

  bd-market-data:
    image: postgres:18
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "123"
    volumes:
      - postgres_market_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - mainServer

  bd-order-service:
    image: postgres:18
    environment:
      POSTGRES_DB: order_service
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "123"
    volumes:
      - postgres_order_service:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - mainServer

  bd-user-data:
    image: postgres:18
    environment:
      POSTGRES_DB: user_data
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "123"
    volumes:
      - postgres_user_data:/var/lib/postgresql
    ports:
      - "5434:5432"
    networks:
      - mainServer

networks:
  mainServer:
    driver: bridge

volumes:
  rabbitmq_node1_data:
  rabbitmq_node2_data:
  rabbitmq_node3_data:
  market-data:
  postgres_market_data:
  postgres_order_service:
  postgres_user_data:
