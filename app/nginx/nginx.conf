events {}

http {
	upstream servidores {
		server websocket-1:8082 max_fails=2 fail_timeout=5s;
    	server websocket-2:8082 max_fails=2 fail_timeout=5s;
	}

	upstream gateways {
		server gateway-1:8082 max_fails=2 fail_timeout=5s;
    	server gateway-2:8082 max_fails=2 fail_timeout=5s;
	}

	server {
		listen 80;
		
		location /ordem {
			proxy_pass http://servidores/ordem;
			proxy_set_header X-Jogador $http_x_jogador;
			proxy_set_header X-Senha $http_x_senha;
			proxy_set_header Host $host;
    	}
		
		location /ws { #websocket
			proxy_pass http://servidores;
            		proxy_http_version 1.1;
            		proxy_set_header Upgrade $http_upgrade;
           		proxy_set_header Connection "upgrade";
           		proxy_set_header Host $host;
            		proxy_read_timeout 3600s;
		}

		#location / { #demais requests

		#}

		location /eventos {
			proxy_pass http://market-data:3000;
			proxy_set_header Host $host;
		}

		location /health {
			proxy_pass http://servidores;
		}

		location / {
			proxy_pass http://gateways;
			proxy_set_header Host $host;
			#root /usr/share/nginx/html;
			#index index.html;
			#try_files $uri /index.html;
		}
	}
}
