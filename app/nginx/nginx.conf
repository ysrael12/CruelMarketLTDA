events {}

http {
	upstream servidores {
		server server-1:8082 max_fails=2 fail_timeout=5s;
    		server server-2:8082 max_fails=2 fail_timeout=5s;
	}
	server {
		listen 80;
		
		location /ordem {
			proxy_pass http://servidores/ordem;
			proxy_set_header X-Jogador $http_x_jogador;
			proxy_set_header X-Senha $http_x_senha;
			proxy_set_header Host $host;
    }
		location /ws {
			proxy_pass http://servidores;
            		proxy_http_version 1.1;
            		proxy_set_header Upgrade $http_upgrade;
           		proxy_set_header Connection "upgrade";
           		proxy_set_header Host $host;
            		proxy_read_timeout 3600s;
		}

		location /ativos {
			proxy_pass http://market-data:3000;
			proxy_set_header Host $host;
		}

		location /health {
			proxy_pass http://servidores;
		}

		location / {
			root /usr/share/nginx/html;
			index index.html;
			try_files $uri /index.html;
		}
	}
}
