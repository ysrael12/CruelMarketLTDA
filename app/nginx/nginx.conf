events {}

http {
	upstream servidores {
		server websocket-1:8082 max_fails=2 fail_timeout=5s;
    	server websocket-2:8082 max_fails=2 fail_timeout=5s;
	}

	upstream gateways {
		server gateway-1:8082 max_fails=2 fail_timeout=5s;
    	server gateway-2:8082 max_fails=2 fail_timeout=5s;
	}

	server {
		listen 80;

		# Endpoint de validação acessível apenas pelo subrequest interno do WebSocket.
		location = /auth/ws-validar {
			return 404;
		}

		location = /_ws_auth {
			internal;
			proxy_pass http://gateways/auth/ws-validar;
			proxy_pass_request_body off;
			proxy_set_header Content-Length "";
			proxy_set_header Host $host;
			proxy_set_header X-Original-URI $request_uri;
		}
		
		location /ordem {
			proxy_pass http://servidores/ordem;
			proxy_set_header X-Jogador $http_x_jogador;
			proxy_set_header X-Senha $http_x_senha;
			proxy_set_header Host $host;
    	}
		
		location /ws { #websocket
			auth_request /_ws_auth;
			auth_request_set $ws_user $upstream_http_x_authenticated_user;
			rewrite ^/ws$ /ws? break;
			proxy_pass http://servidores;
			proxy_set_header X-Authenticated-User $ws_user;
            		proxy_http_version 1.1;
            		proxy_set_header Upgrade $http_upgrade;
           		proxy_set_header Connection "upgrade";
           		proxy_set_header Host $host;
            		proxy_read_timeout 3600s;
		}


		location /ativos {
			proxy_pass http://gateways;
			proxy_set_header Host $host;
		}



		location /eventos {
			proxy_pass http://gateways;
			proxy_set_header Host $host;
		}

		location /health {
			proxy_pass http://gateways;
			proxy_set_header Host $host;
		}

		location /auth/ {
			proxy_pass http://gateways;
			proxy_set_header Host $host;
		}

		location / {
			root /usr/share/nginx/html;
			try_files $uri $uri/ /index.html;
		}
	}
}
